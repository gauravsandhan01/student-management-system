<section class="page-list">
  <div class="page-list__header">
    <div>
      <h1>Teachers</h1>
      <p>Manage instructor information and teaching assignments.</p>
    </div>
    <a class="button" routerLink="/teachers/add">Add teacher</a>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Subject</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let teacher of teachers">
          <td>{{ teacher.id }}</td>
          <td>{{ teacher.name }}</td>
          <td>{{ teacher.subject }}</td>
          <td>{{ teacher.status }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
