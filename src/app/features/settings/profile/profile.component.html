<section class="profile-card">
  <div class="profile-card__header">
    <div>
      <h1>Profile</h1>
      <p>Admin account details and contact information.</p>
    </div>
  </div>

  <div class="profile-card__body">
    <div class="profile-field"><span>Name</span><strong>{{ profile.name }}</strong></div>
    <div class="profile-field"><span>Email</span><strong>{{ profile.email }}</strong></div>
    <div class="profile-field"><span>Role</span><strong>{{ profile.role }}</strong></div>
    <div class="profile-field"><span>Phone</span><strong>{{ profile.phone }}</strong></div>
  </div>
</section>
