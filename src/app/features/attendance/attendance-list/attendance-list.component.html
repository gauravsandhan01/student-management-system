<section class="page-list">
  <div class="page-list__header">
    <div>
      <h1>Attendance</h1>
      <p>Daily attendance records for enrolled students.</p>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Student</th>
          <th>Grade</th>
          <th>Date</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let record of records">
          <td>{{ record.student }}</td>
          <td>{{ record.grade }}</td>
          <td>{{ record.date }}</td>
          <td>{{ record.status }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
