<section class="auth-page">
  <div class="auth-card">
    <h1>Login</h1>
    <p>Access your student management dashboard.</p>
    <form (ngSubmit)="submitLogin()">
      <label>
        Email
        <input type="email" [(ngModel)]="credentials.email" name="email" required />
      </label>
      <label>
        Password
        <input type="password" [(ngModel)]="credentials.password" name="password" required />
      </label>
      <button type="submit">Sign in</button>
    </form>
    <p class="auth-note">Don’t have an account? <a routerLink="/register">Register</a></p>
  </div>
</section>
